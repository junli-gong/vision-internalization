  batch_size: 8
  eval_every: 250
  ckpt_every: 250
  probe_chunk: 8
  probe_chunk_max_elements: 134217728
  out_channels: 1
  holdout:
    group: image_id
    min_items: 128
    n_val: 128
  loss:
    kind: bce_dice
    bce_weight: 1.0
    dice_weight: 1.0
    dice_smooth: 1.0
    basis: 逐像素二值交叉熵（logits）+ Dice（sigmoid 概率，1 − (2Σpg + s)/(Σp + Σg + s)），在 GT 分辨率上
  optim:
    optimizer: adamw
    lr:
      linear: 0.001
      conv: 0.0005
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0001
    schedule: warmup_cosine
    warmup_steps: 100
    min_lr_ratio: 0.0
  feature_norm:
    kind: per_channel_standardize
    n_samples: 256
    eps: 1.0e-06
  probes:
    linear:
      kind: conv1x1
    conv:
      kind: conv3x3_gelu_conv3x3
      hidden: 256
      kernel: 3
      padding: 1
  upsample:
    mode: bilinear
    align_corners: false
    impl: separable_matmul
  bootstrap_resamples: 1000
