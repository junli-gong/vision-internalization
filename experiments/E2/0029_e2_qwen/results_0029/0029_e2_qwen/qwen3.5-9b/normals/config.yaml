  hidden_size: 4096
  pre_norm_last: L32_pre
  convention: 0 = 视觉特征并入之后的嵌入输出；i = 第 i 个 decoder 层输出；num_layers = 最终归一化之后（D19）；L{N}_pre
    = 最后一个 decoder 层的原始输出（最终归一化之前，单列；D53-3）
