training:
  steps: 1000
  batch_size: 8
  eval_every: 100
  ckpt_every: 100
  probe_chunk: 8
  probe_chunk_max_elements: 134217728
  out_channels: 3
  holdout:
    group: idx
    min_items: 32
    n_val: 32
  loss:
    kind: cosine
    basis: 预测逐像素单位化后 1 − cos(预测, GT) 在有效掩码（GT 非 (0,0,0)）上的平均
  optim:
    optimizer: adamw
    lr:
      linear: 0.001
      conv: 0.0005
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0001
    schedule: warmup_cosine
    warmup_steps: 100
    min_lr_ratio: 0.0
  feature_norm:
    kind: per_channel_standardize
    n_samples: 256
    eps: 1.0e-06
  probes:
    linear:
      kind: conv1x1
    conv:
      kind: conv3x3_gelu_conv3x3
      hidden: 256
      kernel: 3
      padding: 1
  upsample:
    mode: bilinear
    align_corners: false
    impl: separable_matmul
  bootstrap_resamples: 1000
