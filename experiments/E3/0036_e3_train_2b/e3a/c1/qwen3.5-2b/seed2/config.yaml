    class_proj: 135232
    decoder_budget_total: 3806490
    heads:
      refseg: 65
      depth: 65
      normals: 195
    readout_total: 3806815
    limits:
      decoder_budget_total: 50000000
      each_head: 1000
    basis: decoder_budget_total = mix + decoder + class_proj（class_proj 只用于类别头，保守地计入解码器的预算）；每个线性头单独
