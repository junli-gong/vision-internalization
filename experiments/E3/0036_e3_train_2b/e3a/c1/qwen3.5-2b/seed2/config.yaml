    grid: 16
    position_mode: grid2d
instructions:
  refseg:
    order: instruction_first
    instruction_template: Segment {expression} in the image.
  depth:
    order: instruction_first
    instruction_template: Estimate the depth of the image.
  semseg:
    order: instruction_first
    instruction_template: 'Segment the image into these classes: {classes}.'
    class_names_sha256: f9dbd8a75a0722c971d8c82db76dc205e06cb422d98153f4e5bbf90408ef5438
  normals:
    order: instruction_first
    instruction_template: Estimate the surface normals of the image.
class_names_check:
  checked: true
  file: /dev/shm/visint/train_data/ade20k/objectInfo150.txt
  sha256: c368be0cf078eb49264b5a0d0c4ad2e63bbfedf260c48458984302e2a7995671
losses:
  refseg:
    kind: bce_dice
    bce_weight: 1.0
    dice_weight: 1.0
    dice_smooth: 1.0
  depth:
    kind: silog
    variance_focus: 0.85
    scale: 10.0
  semseg:
    kind: cross_entropy
  normals:
    kind: cosine
gt:
  refseg:
    gt: src/e1/scoring.gt_mask（与 E1、E3b 同一套解码）→ 最近邻到 128 × 128（0/1）
  depth:
    gt: 有效像素（NYU_DEPTH_MIN < d < NYU_DEPTH_MAX，与 E2 的 depth_train_valid 相同）上 log 深度的面积平均（即几何平均）到
      128 × 128；有效面积不足 min_valid_fraction 的格子不监督
    min_valid_fraction: 0.5
  semseg:
    gt: 标签最近邻到 128 × 128，再 reduce_zero_label（0 → ADE_IGNORE_INDEX 忽略，其余减 1；与 E2 相同）
  normals:
    gt: 有效像素（GT 非 (0,0,0)）上单位法向的面积平均，再单位化，到 128 × 128；有效面积不足 min_valid_fraction 或平均向量的范数
      < 1e-6 的格子不监督
    min_valid_fraction: 0.5
