experiment: E5
framework: src/e5（DEV-0040：只评起点，N = 0）
system: trained
start_only: true
n_train: 0
start_only_rule: DEV-0040（D81-1；E5 预注册 §8 第 2 项）：只评起点，N = 0——起点检查点不经 E5 训练，加载 = src/e5/stack.load_start_only（与训练后评测只差没有
  E5 LoRA），评测与训练后评测同一套函数；用于区分截距与斜率，不单独参与 H5 判定
task: rotation3d
task_letter: a
subset: eval
data:
  generator: src.synth.generate
  split: test
  n_per_bin: 100
  n_samples: 400
