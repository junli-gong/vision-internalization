    build_spec:
      family_kw: {}
      image_policy: pixel_budget:300
      key: qwen3.5-2b
      tiny: false
    image_policy: pixel_budget:300
    dtype: bfloat16
    n_grid_tokens: 67
    leaf_variant: warmup
    expected_variant: warmup
    leaf_seed: 0
  fingerprint:
    value: b5f761fbd43f812e362c98ce9cfd587a0f9dac9f283822054b36dab52e15d276
    device_key:
      device_type: cuda
      dtype: bfloat16
      gpu: NVIDIA B200
    rule: src/e5/stack.stack_fingerprint：合并起点 LoRA 之后、加网格 token 之前；必须等于 factory.load_trained(起点,
      merge=True) 的（src/e5/stack.reference_fingerprint）
  seed: 0
  seed_pairing:
    seed: 0
    start_seed: 0
    allow_mismatch: false
    rule: D77-3：E5 的第 i 个种子用 E3 的第 i 个种子训练的起点检查点；起点的种子取它训练叶目录 config.yaml 的 seed（manifest
      不记种子）；不符或核对不了就拒绝训练，--allow-seed-mismatch 放开（记进运行身份）
    status: match
  checks:
    done:
      start_merge_check:
        purpose: grid_eval
        checks:
        - merge
        - restricted
        n: 200
        criteria_version: v1
      start_fingerprint: 合并起点 LoRA 之后的权重指纹 = factory.load_trained(起点, merge=True)
        的
    skipped:
      e5_lora_merge: 训练后评测的“E5 LoRA 合并前后”核对（stacked_merge_check）不适用：只评起点没有 E5 LoRA，起点
        LoRA 已合并，评测的模型就是起点合并评测时的权重（由起点检查点的合并核对与权重指纹核对）
decoding:
  path: generate_batch
  allowed_ids:
  - 248046
  - 248077
  - 248078
  - 248143
  value_ids:
  - 248077
  - 248078
  format: binary
  max_new_tokens: 1057
  stop_ids:
  - 248046
  enable_thinking: false
  greedy: true
  grid_size: 32
  mode: structured
  logits_processor: StructuredGridProcessor
  structure:
    n: 32
    length: 1057
    row_id: 248143
    stop_id: 248046
    value_ids:
    - 248077
    - 248078
    value_ids_per_row: false
    rule: 结构强制（D83，DEV-0041）：第 r 行的格子位置只允许第 r 行的值 token，行末只允许行分隔，最后一个位置只允许停止 token；长度恒为
      n(n + 1) + 1；只强制网格的形状，不注入任务知识。经 generate_batch(allowed_token_ids = 任务的允许集合,
      logits_processor = [StructuredGridProcessor]) 实现（src/grid/structured_decode.py）
  basis: D83-3（E5 预注册 §8a 第 5 项）：E5 的全部网格任务（二值 c、d、e 与 33 个符号的起伏 a、b）在 N = 0、val 选择与
    test 评测里都以结构强制解码为正式口径；网格形状固定，强制结构不注入任务知识
batching:
  batch_size: 64
  order: 样本顺序，连续成批，左填充（适配器）
prompt:
  template: '{instruction} {ending}'
  endings:
    binary: Output the {n}x{n} mask grid.
    relief: Output the {n}x{n} depth grid.
  endings_from:
    binary: tasks.refseg.grid_template
    relief: tasks.depth.grid_instruction
  order: instruction_first
