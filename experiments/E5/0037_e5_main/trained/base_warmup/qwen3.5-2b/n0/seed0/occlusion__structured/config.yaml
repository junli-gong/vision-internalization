  limit: null
  index_rule: 序号 0..B·n−1，档 = 序号 mod B（src/e5/protocol.py；与零样本相同）
  task_generator_version: 2
  synth_generator_version: 5
n_resamples: 1000
tiny: false
dtype: bf16
headline_scope: 全部样本
gate:
  rule: D59-4：配对 bootstrap 95% CI，判定条件同时胜过 copy_flat、gt_affine_upper、copy_convex
checkpoint:
  start_only: true
  n_train: 0
  start:
    kind: base_warmup
