    rule: 结构强制（D83，DEV-0041）：第 r 行的格子位置只允许第 r 行的值 token，行末只允许行分隔，最后一个位置只允许停止 token；长度恒为
      n(n + 1) + 1；只强制网格的形状，不注入任务知识。经 generate_batch(allowed_token_ids = 任务的允许集合,
      logits_processor = [StructuredGridProcessor]) 实现（src/grid/structured_decode.py）
  basis: D83-3（E5 预注册 §8a 第 5 项）：E5 的全部网格任务（二值 c、d、e 与 33 个符号的起伏 a、b）在 N = 0、val 选择与
