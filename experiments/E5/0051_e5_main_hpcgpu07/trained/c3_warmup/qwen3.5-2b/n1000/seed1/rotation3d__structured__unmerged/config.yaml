experiment: E5
framework: src/e5（DEV-0037：训练后系统的评测）
system: trained
lora_merge: unmerged
lora_merge_basis: D99-2（负责人，2026-10-17；E5 预注册 §8c 补充，写于读到任何 E5 训练后 test 分数之前）：敏感性分析——H5
  判定用到的 12 个运行（E3b+C3 与 C3+预热，1K、4K，各 3 个种子）用未合并的 E5 LoRA 在 test 上再评一次，结构强制解码，其余同正式评测；门报告同时报告合并与未合并两种口径下的
  H5 结论
lora_merge_rule: DEV-0048：加载同正式评测（base → 合并起点 LoRA → 核对起点 → load_trained(E5 检查点, merge=False)），E5
  LoRA 保持 injected、不合并；评测走 run_task 与 decode_grids(decode=structured)，与正式评测同一条路径（样本、提示、批大小、解析、评分、汇总、门槛都不变）；解码期间逐批做
  LoRA 审计（LoraAudit，规则同 DEV-0046），审计不过就报错、这一批不写、不写 metrics
skipped_checks:
  e5_lora_merge: D99-2 敏感性分析：评测的就是未合并的模型；合并核对见同一检查点的 merge_check.json
