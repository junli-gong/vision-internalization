lisa:
  code:
    upstream: https://github.com/dvlab-research/LISA
    commit: 3cb2d4301f1af4691bd4f3938335ef06e76f155a
    license: Apache-2.0
    dir: third_party/lisa
    provenance_sha256: 2ab8d4ec28e252504d5a15c882d28922ef1645c0f9d4a9594e3781c937ba6ad4
    n_files: 49
    files_sha256_digest: ef7e75a7d1c360caf295ffd0c45bdfd55ddd775e2e790409ddca68072f776657
    modified_files: []
  paper: 'Lai et al., LISA: Reasoning Segmentation via Large Language Model（CVPR 2024；arXiv
    2308.00692）'
  protocol:
    name: refer_seg_validate
    what: 官方 refer_seg 评测（论文表格的口径）：train_ds.py --eval_only 的 validate()，数据走 utils/dataset.py
      的 ValDataset（refer_seg 分支）与 collate_fn；回答由评测直接给出 "[SEG]."（teacher forcing），LLM
      一次前向，取 [SEG] 的隐藏状态经 SAM 解码
    conv_type: llava_v1
    use_mm_start_end: true
    question: <image>\n What is {sent} in this image? Please output segmentation mask.
    answer: '[SEG].'
    sentence: REFER 的 sent 字段（我们 W2 样本的 fields.expression）.strip().lower()
    clip_preprocess: CLIPImageProcessor.from_pretrained(vision_tower).preprocess(RGB
      uint8)：短边缩到 224（bicubic）、中心裁 224、归一化
    sam_preprocess: ResizeLongestSide(1024).apply_image（长边 1024，PIL 双线性）→ (x − mean)/std（mean
      123.675/116.28/103.53，std 58.395/57.12/57.375）→ 右下补零到 1024×1024
    image_read: cv2.imread → BGR 转 RGB
    mask: SAM 低分辨率 logits → 双线性放大到 1024 → 裁掉补零 → 双线性缩放到原图尺寸（标注的 height、width）→ logit
      > 0
    precision: bf16
    image_size: 1024
    model_max_length: 512
    vision_tower: openai/clip-vit-large-patch14（config.vision_tower）
    batch: 一句一次前向（官方 val_batch_size = 1 张图，同一张图的全部句子在一次前向里；这里每批一句，见 PROVENANCE.md
      的偏离 2）
  citations: third_party/lisa/PROVENANCE.md
  runner:
    kind: lisa
    factory: null
    fixes_applied:
    - addedtoken_str_patch
    - tokenizers_hidden
    - vision_tower_local_snapshot
    fix_descriptions:
      addedtoken_str_patch: 没有 tokenizers 时，加载分词器之前给 transformers 4.31 的 AddedToken
        替身补上 __str__ = content（RUN-0015 §4）
      tokenizers_hidden: import transformers 之前屏蔽继承来的新版 tokenizers（src/lisa/common.hide_tokenizers）
      vision_tower_local_snapshot: config 的 vision_tower / mm_vision_tower 改成 --clip-weights
        的本地目录（同一份权重）再 from_pretrained
