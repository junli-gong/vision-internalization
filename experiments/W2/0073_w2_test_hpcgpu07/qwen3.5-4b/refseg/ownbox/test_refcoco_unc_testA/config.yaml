raster_rule: 框 = 框记录的 parsed.box（parse_one_box 换算好的原图绝对像素 xyxy，同 E1 定位）；解析失败（parsed
  为 null）的框是空 mask（同 E1：失败的预测 inter = 0、union = GT 面积）。多边形对照：框的四个角 (x0, y0)、(x1, y0)、(x1,
  y1)、(x0, y1) 当作一个多边形，经 E1 多边形的同一个光栅化（src/executors/raster.polygons_to_mask，pycocotools）得到
  mask，与 GT mask 算 inter / union；cIoU = Σinter / Σunion，gIoU = 逐条 IoU 的平均。网格对照：同一个框
  mask 经 src/grid/codec.mask_to_grid 填进 16×16 网格（格内前景占比 ≥ GRID_FG_AREA_THRESHOLD =
  0.5 记 1，与网格的 GT 目标同一条规则），再 grid_to_mask 回填到原图，与 GT 算 gIoU 与 cIoU，同 E1 grid16 的评分。
