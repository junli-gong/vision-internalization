      rule: 数字逐位（每个十进制数字一个单 token）；四段结构各取单独编码的 token 序列；探针多边形的整段编码 = 各段编码与逐位数字的拼接、解码回来逐字相同（configs/e1_posthoc.json
        的 format_forced_poly.tokenization）
    rule: 至少 3 个点（E1 解析的下限 MIN_POLYGON_POINTS）：第 3 个点写完之前不允许 close。
    grammar_rule: 生成必须恰好是 open 点 (point_sep 点)… close，再接一个停止 token；点 = 整数 xy_sep 整数。逐位置的
      logits 处理器（src/e1/poly_forced.PolyStructureProcessor，经 generate_batch 的 logits_processor
      传入，不改模型）从已生成的 token 推出每一行的状态，只留合乎语法的下一个 token，其余 logit 置 −inf：开头只留 open；写数字时只留合乎
      integer_rule 的数字，已写了至少一位时另留下一段的第一个 token（x 之后是 xy_sep；y 之后是 point_sep（已写完的点数
      + 1 < max_points 时）与 close（已写完的点数 + 1 ≥ min_points 时））；一段写到一半时只留这一段的下一个 token；close
      之后只留本家族的停止 token（adapter.stop_token_ids）。点数由模型决定。
    near_rectangle:
      n_points: 4
      min_area_ratio: 0.95
