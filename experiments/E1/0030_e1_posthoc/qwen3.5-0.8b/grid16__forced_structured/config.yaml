  forced:
    variant: structured
    fixed_length: true
    answer_prefix: null
    allowed_texts:
    - '0'
    - '1'
    - '

      '
    format_ids:
      ids:
      - 15
      - 16
      - 198
      digit_ids:
      - 15
      - 16
      newline_id: 198
      tokens:
      - role: digit_0
        text: '0'
        id: 15
        token: '0'
      - role: digit_1
        text: '1'
        id: 16
        token: '1'
      - role: newline
        text: '

          '
        id: 198
        token: Ċ
      probe:
        grid_size: 16
        n_tokens: 271
        distinct_ids:
        - 15
        - 16
        - 198
      rule: 同 scripts/check_training_interfaces.grid_allowed 的构造（编码 16×16 示例网格必须恰好由
        0、1、换行三个单 token 组成），不加停止 token
    n_tokens: 271
    newline_period: 17
    stop_tokens_allowed: false
    rule: 补充（结构强制）：在主读法的允许集合之上，每行第 17 个位置（生成的第 t 个 token，t 从 0 起，t mod 17 = 16，即 16、33、…、254）只允许换行，其余位置只允许
      0、1；固定 271 个 token，所以必然是合法的 16×16 网格。逐位置的允许集合用 logits 处理器实现（src/e1/forced.GridStructureProcessor，经
      generate_batch 的 logits_processor 传入），不改模型。
    fixed_length_rule: 固定长度的两种网格读法：停止 token 不在允许集合里，每行都恰好生成 n_tokens 个 token、stopped
      = False，这是设计如此，不是截断：记录的 truncated 记 False（另记 fixed_length = true），解析时不判截断（parse_generation
      只看思考段未闭合与空回答，再交给 parse_grid_text）。多边形预填照常：写满上限没有停止 token 就是截断。
