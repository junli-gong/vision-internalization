  category_order: null
  system_prompt: You are a helpful assistant
  question_template: Detect [OBJ]. Output the bounding box coordinates in [x0, y0,
    x1, y1] format.
  category_join: ', '
  image:
    mode: RGB
    min_pixels: 12544
    max_pixels: 2007040
    factor: 28
    resize: smart_resize（Qwen2.5-VL；PIL 后端的图像处理器，bicubic）
  generation:
    backend: transformers generate（官方 rex_omni/wrapper.py 的 transformers 分支）
    do_sample: false
    num_beams: 1
    repetition_penalty: 1.05
    max_new_tokens: 4096
    max_model_len: 4096
    max_new_tokens_rule: min(max_new_tokens, max_model_len − 提示长度)；一批取批内最长的提示
    stop_strings:
    - <0><0><0><0>
    eos: <|im_end|>
    pad_token_id: eos（wrapper.py:838）
    skip_special_tokens: false
    clean_up_tokenization_spaces: false
    padding_side: left
    official_sampling:
      temperature: 0.0
      top_p: 0.8
      top_k: 1
      repetition_penalty: 1.05
    torch_dtype: bfloat16
    attn_implementation: sdpa
  parsing:
    source: evaluation/inference_text_prompt.py parse_prediction / _process_box_text
    bins: <0>…<999>，像素 = 网格 / 999.0 × 原图宽或高，不截到图内
    boxes: 只认恰好 4 个数的坐标串（convert_coco_lvis_to_standard_format.py:102），类名 lower() 且
      '_' → ' ' 后比较
    order: 输出顺序，不去重、不加 NMS（官方没有；分数常数 0.2）
  deviations:
  - 每个（图像, 类别）调用一次，提示里只有这一个类别（与 X-M 同协议，诊断）。官方 COCO/LVIS 评测是每图一次、提示里用 ', ' 连起该图全部正类别（inference_text_prompt.py:599；Rex-Omni-EvalData
    的 COCO.jsonl）：本读数不是官方协议的复现
  - transformers 后端（官方 wrapper 的 transformers 分支），不是论文读数用的 vLLM；vLLM 的停止串 <0><0><0><0>
    与 max_model_len 4096 照搬
  - 注意力 sdpa（官方缺省 flash_attention_2；服务器没有 flash-attn）
  - 分词器由官方慢分词器文件重建（src/rexomni/model.build_tokenizer）：transformers 5 直接读会把 1,022 个新增
    token 的 id 排错；重建后与 tokenizer_config.json 逐个相同，与慢分词器只在含被顶掉的 1,000 个罕见 BPE token
    的文本上不同
  - 不在所问类别里的类名下的框丢掉并计数（官方是记到那个类别上再按 positive_only 过滤）
