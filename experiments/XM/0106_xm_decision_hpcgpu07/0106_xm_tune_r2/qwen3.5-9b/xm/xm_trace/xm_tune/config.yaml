        call2_example: 'Each numbered box below contains one instance of the category
          "<category>" in the image (2 listed):

          1: [100, 100, 300, 300]

          2: [500, 500, 700, 700]

          For each box, in the same order, trace the outer contour of its instance
          with a closed periodic uniform cubic B-spline of exactly 16 control points.
          Coordinates are integers on a 0-1000 grid of the image, x first. Output
          only JSON: a list of 2 splines, one per box, each [[x, y], ...] with exactly
          16 points.'
      n: 16
      sample: 列框：原图 + call1_prompt(类别) → format_boxes(全部框)；每实例样条：原图 + call2_prompt(类别,
